{% extends "base.html" %}

{% block title %}Editar Fundo - Geld's Finance{% endblock %}

{% block header %}Editar Fundo{% endblock %}

{% block content %}

<div class="center">
    <form method="POST" action="{{ url_for('fundos.edit_fundo', fundo_id=fundo.id) }}">
        <div class="label">
            <label for="nome_fundo">Nome do Fundo:</label>
            <input type="text" id="nome_fundo" name="nome_fundo" value="{{ fundo.nome_fundo }}" required>
        </div>
        
        <div class="label">
            <label for="cnpj">CNPJ:</label>
            <input type="text"  id="cnpj" name="cnpj" value="{{ fundo.cnpj }}" required>
        </div>
        
        <div class="label">
            <label for="classe_anbima">Classe Anbima:</label>
            <input type="text"  id="classe_anbima" name="classe_anbima" value="{{ fundo.classe_anbima }}" >
        </div>
        
        <div class="label">
            <label for="mov_min">Movimentação Mínima:</label>
            <input type="number"  id="mov_min" name="mov_min" value="{{ fundo.mov_min }}" >
        </div>
        
        <div class="label">
            <label for="permanencia_min">Permanência Mínima: </label>
            <input type="number" id="permanencia_min" name="permanencia_min" value="{{ fundo.permanencia_min }}" >
        </div>
           
        <div class="label">
            <label for="valor_cota">Valor da Cota (R$):</label>
            <input type="number" id="valor_cota" name="valor_cota" step="0.0000001" value="{{ fundo.valor_cota }}" required>
        </div>

        <div class="label">
            <label for="risco">Risco:</label>
            <select id="risco" name="risco" required onchange="toggleSubtipo()">
                <option value="baixo" {% if fundo.risco.value == 'baixo' %}selected{% endif %}>Baixo</option>
                <option value="moderado" {% if fundo.risco.value == 'moderado' %}selected{% endif %}>Moderado</option>
                <option value="alto" {% if fundo.risco.value == 'alto' %}selected{% endif %}>Alto</option>
                <option value="ouro" {% if fundo.risco.value == 'ouro' %}selected{% endif %}>Ouro</option>
                <option value="dolar" {% if fundo.risco.value == 'dolar' %}selected{% endif %}>Dólar</option>
                <option value="cripto" {% if fundo.risco.value == 'cripto' %}selected{% endif %}>Cripto</option>
                <option value="internacional" {% if fundo.risco.value == 'internacional' %}selected{% endif %}>Internacional</option>
                <option value="fii" {% if fundo.risco.value == 'fii' %}selected{% endif %}>FII</option>
            </select>
        </div>
        
        <div class="label" id="subtipo_container" style="display: {% if fundo.risco.value == 'baixo' %}block{% else %}none{% endif %};">
            <label for="subtipo_risco">Subtipo:</label>
            <select id="subtipo_risco" name="subtipo_risco">
                <option value="di" {% if fundo.subtipo_risco and fundo.subtipo_risco.value == 'di' %}selected{% endif %}>DI</option>
                <option value="rfx" {% if fundo.subtipo_risco and fundo.subtipo_risco.value == 'rfx' %}selected{% endif %}>RFx</option>
            </select>
        </div>

        <div class="label" id="subtipo_ativo_container">
            <label for="subtipo_ativo_id">Slot de Distribuição:</label>
            <select id="subtipo_ativo_id" name="subtipo_ativo_id">
                <option value="">— nenhum —</option>
                {% for s in subtipos_por_classe.get(fundo.risco.value, []) %}
                <option value="{{ s.id }}" {% if fundo.subtipo_ativo_id == s.id %}selected{% endif %}>
                    {{ s.letra }} — {{ s.nome }}
                </option>
                {% endfor %}
            </select>
        </div>
        
        <div class="label">
            <label for="is_previdencia">Produto de Previdência (PGBL/VGBL):</label>
            <label class="toggle-switch">
                <input type="checkbox" id="is_previdencia" name="is_previdencia" value="1"
                       {% if fundo.is_previdencia %}checked{% endif %}>
                <span class="toggle-slider"></span>
            </label>
        </div>

        <div class="label">
            <label for="status_fundo">Status:</label>
            <select id="status_fundo" name="status_fundo" required>
                <option value="ativo" {% if fundo.status_fundo.value == 'ativo' %}selected{% endif %}>Ativo</option>
                <option value="encerrado" {% if fundo.status_fundo.value == 'encerrado' %}selected{% endif %}>Encerrado</option>
            </select>
        </div>
        <div class="label">
            <label for="data_atualizacao">Data de Atualização:</label>
            <input type="date" id="data_atualizacao" name="data_atualizacao" value="{{ fundo.data_atualizacao.strftime('%Y-%m-%d') if fundo.data_atualizacao else '' }}" required>
        </div>
        <div class="label" style="margin-top: 20px;">
            <label></label>
            <div>
                <button type="submit" class="smlBtn"><img src="{{ url_for('static', filename='icons/save.png') }}" class="sml-btn-icon"></button>
                <button type="button" class="smlBtn" onclick="window.location.href=`{{ url_for('fundos.listar_fundos') }}`"><img src="{{ url_for('static', filename='icons/back.png') }}" class="sml-btn-icon"></button> 
            </div>
    </form>
    
    <script>
    const subtiposPorClasse = {{ subtipos_por_classe | tojson }};
    const subtipoAtivoAtual = {{ fundo.subtipo_ativo_id | tojson }};

    const classesSemSlot = ['ouro', 'dolar', 'cripto', 'internacional', 'fii'];

    function toggleSubtipo() {
        const risco = document.getElementById('risco').value;
        const subtipoContainer = document.getElementById('subtipo_container');
        const subtipoSelect = document.getElementById('subtipo_risco');
        const subtipoAtivoContainer = document.getElementById('subtipo_ativo_container');
        const subtipoAtivoSelect = document.getElementById('subtipo_ativo_id');

        if (risco === 'baixo') {
            subtipoContainer.style.display = 'block';
            subtipoSelect.required = true;
        } else {
            subtipoContainer.style.display = 'none';
            subtipoSelect.required = false;
        }

        if (classesSemSlot.includes(risco)) {
            subtipoAtivoContainer.style.display = 'none';
            subtipoAtivoSelect.value = '';
        } else {
            subtipoAtivoContainer.style.display = 'block';
            const slots = subtiposPorClasse[risco] || [];
            subtipoAtivoSelect.innerHTML = '<option value="">— nenhum —</option>';
            slots.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.id;
                opt.textContent = s.letra + ' — ' + s.nome;
                if (s.id === subtipoAtivoAtual) opt.selected = true;
                subtipoAtivoSelect.appendChild(opt);
            });
        }
    }

    document.addEventListener('DOMContentLoaded', toggleSubtipo);
    </script>
</div>






{% endblock %}
