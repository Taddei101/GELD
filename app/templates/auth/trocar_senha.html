{% extends "base.html" %}

{% block title %}Trocar senha - Geld's Finance{% endblock %}

{% block header %}Trocar senha{% endblock %}

{% block content %}
<form method="POST">
    <div class="login">
        <label for="atual">Senha atual:</label>
        <input type="password" id="atual" name="atual" required>
    </div>
    <div class="login">
        <label for="nova">Nova senha:</label>
        <input type="password" id="nova" name="nova" minlength="8" required>
    </div>
    <div class="login">
        <label for="confirmar">Confirmar nova senha:</label>
        <input type="password" id="confirmar" name="confirmar" minlength="8" required>
    </div>
    <button type="submit">Salvar</button>
</form>
{% endblock %}
